; Cliper X OS — Polybar Configuration
; Status bar showing system info, battery, network, tools

[colors]
background = #1a1a2e
background-alt = #16213e
foreground = #e0e0e0
primary = #ff6e6e
secondary = #0f3460
alert = #e94560
success = #00ff88
warning = #ffaa00
disabled = #555555

[bar/cliperx]
width = 100%
height = 28pt
radius = 0
dpi = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Hack Nerd Font:size=10;3"
font-1 = "Font Awesome 6 Free Solid:size=10;3"
font-2 = "Hack Nerd Font:size=14;4"

modules-left = i3 xwindow
modules-center = date
modules-right = cliperx-tools wlan eth battery cpu memory temperature fan pulseaudio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = right
tray-padding = 4

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
hwmon-path = /sys/class/thermal/thermal_zone0/temp
base-temperature = 30
warn-temperature = 70

format = <ramp> <label>
format-warn = <ramp> <label-warn>

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0 = 
ramp-0-foreground = ${colors.success}
ramp-1 = 
ramp-1-foreground = ${colors.warning}
ramp-2 = 
ramp-2-foreground = ${colors.alert}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 98
low-at = 15
poll-interval = 30

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low> <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full =  %percentage%%
label-full-foreground = ${colors.success}
label-low =  %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 = 
ramp-capacity-1-foreground = ${colors.warning}
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-4-foreground = ${colors.success}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

animation-low-0 = 
animation-low-1 = 
animation-low-framerate = 500

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <ramp-signal> <label-connected>
label-connected = %essid% %local_ip%

format-disconnected = <label-disconnected>
label-disconnected = 睊 OFF
label-disconnected-foreground = ${colors.disabled}

ramp-signal-0 = 直
ramp-signal-0-foreground = ${colors.alert}
ramp-signal-1 = 直
ramp-signal-1-foreground = ${colors.warning}
ramp-signal-2 = 直
ramp-signal-2-foreground = ${colors.success}

[module/eth]
type = internal/network
interface-type = wired
interval = 5

label-connected =  %local_ip%
label-disconnected = ""

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 婢 MUTE
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 奄
ramp-volume-1 = 奔
ramp-volume-2 = 墳

[module/date]
type = internal/date
interval = 1

date = %a %d %b
time = %H:%M:%S

label =  %date%   %time%
label-foreground = ${colors.primary}

[module/fan]
type = custom/script
exec = cat /sys/class/hwmon/hwmon0/fan1_input 2>/dev/null || echo "N/A"
interval = 5
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %output% RPM

[module/cliperx-tools]
type = custom/script
exec = echo "CLIPER X"
interval = 3600
format-foreground = ${colors.primary}
format-font = 3
click-left = rofi -show drun -theme cliperx

[settings]
screenchange-reload = true
pseudo-transparency = false
