#!/usr/sbin/nft -f
# Cliper X OS — Firewall Configuration (nftables)
# Default deny with allowlists for security tools

flush ruleset

table inet cliperx_firewall {

    # ========================
    # Input Chain
    # ========================
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow established/related connections
        ct state established,related accept

        # Allow loopback
        iifname "lo" accept

        # Allow ICMP (ping)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Allow SSH (rate limited)
        tcp dport 22 ct state new limit rate 3/minute accept

        # Allow DHCP client
        udp sport 67 udp dport 68 accept

        # Allow DNS responses
        udp sport 53 accept
        tcp sport 53 accept

        # Allow mDNS (local network discovery)
        udp dport 5353 accept

        # Allow VPN
        udp dport 1194 accept  # OpenVPN
        udp dport 51820 accept # WireGuard

        # Log dropped packets (limited)
        limit rate 5/minute log prefix "CLIPER-X-DROP: " level info

        # Drop everything else
        drop
    }

    # ========================
    # Output Chain
    # ========================
    chain output {
        type filter hook output priority filter; policy accept;

        # Allow all outbound (we're a pentesting device)
        accept
    }

    # ========================
    # Forward Chain
    # ========================
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Allow forwarding for hotspot/rogue AP
        ct state established,related accept

        # Allow from WiFi AP interface
        iifname "wlan1" accept

        drop
    }
}

# NAT for rogue AP / hotspot
table ip cliperx_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat;

        # Masquerade traffic from AP interface
        oifname "wlan0" masquerade
        oifname "eth0" masquerade
    }
}
